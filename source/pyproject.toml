[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upright-pendulum"
version = "0.1.0"
description = "Validated cart-pendulum simulation and independent PPO generation cohorts"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "gymnasium>=1.0,<2"]

[project.optional-dependencies]
validation = ["pytest>=8,<10", "scipy>=1.13,<2", "matplotlib>=3.9,<4"]
training = ["stable-baselines3>=2.7,<3", "torch>=2.3,<3"]

[tool.setuptools]
license-files = ["LICENSE", "third_party/SB3_LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["upright_pendulum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["training: a tiny real PPO integration check; skipped if training dependencies are absent"]
